{% extends "base.html" %}

<!-- Telling the Workspace that the Bones Tab is Active when This Page is Loaded -->
        <!-- Understanding of Nameable Blocks from Google AI Overview. -->
{% block bones_tab_status %}active{% endblock %}

{% block bones_tab_btns %}
<!-- Bones Tab Content -->
<div class="button-group">
    <button class="action-btn">Add Rig</button>
    <button class="action-btn">Add Bone</button>
    <button class="action-btn">Add Arm</button>
    <button class="action-btn">Add Leg</button>
    <button class="action-btn">Add IK Chain</button>
</div>
{% endblock %}

{% block viewport_content %}
<!-- Infinite Perspective Grid -->
                            <div class="viewport-grid">
                                <div class="horizon-line"></div>
                                <div class="grid-lines-vertical">
                                    <div class="grid-v-line center"></div>
                                    <div class="grid-v-line v30"></div>
                                    <div class="grid-v-line v15"></div>
                                    <div class="grid-v-line v5"></div>
                                    <div class="grid-v-line v70"></div>
                                    <div class="grid-v-line v85"></div>
                                    <div class="grid-v-line v95"></div>
                                </div>
                                <div class="grid-lines-horizontal">
                                    <div class="grid-h-line h1"></div>
                                    <div class="grid-h-line h2"></div>
                                    <div class="grid-h-line h3"></div>
                                    <div class="grid-h-line h4"></div>
                                    <div class="grid-h-line h5"></div>
                                    <div class="grid-h-line h6"></div>
                                    <div class="grid-h-line h7"></div>
                                    <div class="grid-h-line h8"></div>
                                </div>
                            </div>
{% endblock %}
